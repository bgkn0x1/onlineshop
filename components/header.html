<header class="bg-emagDark text-white sticky top-0 z-50 shadow-md">
    <div class="container mx-auto px-4 py-3 flex flex-col gap-3 relative">
        <div class="flex items-center gap-2 w-full">
            <button onclick="switchView('home')" class="text-gray-300 hover:text-white px-2 py-2 text-lg focus:outline-none transition" title="Начало">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="flex-1 relative">
                <input type="text" id="searchInput" placeholder="Търсене на продукти, марки, категории..." class="w-full py-2.5 px-4 rounded-l-lg bg-white text-gray-800 focus:outline-none text-sm" oninput="handleSearch(this.value)">
                <button class="absolute right-0 top-0 h-full bg-emagOrange px-4 md:px-5 rounded-r-lg text-white hover:bg-opacity-90 transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
        <div class="flex items-center justify-between">
            <div class="relative">
                <button id="categoryDropdownBtn" onclick="toggleCategoryDropdown(event)" class="text-sm bg-gray-800 hover:bg-gray-700 px-3.5 py-2 rounded-lg focus:outline-none flex items-center gap-2 transition border border-gray-700">
                    <i class="fa-solid fa-bars text-emagOrange text-base"></i>
                    <span class="font-semibold">Категории</span>
                </button>
                <div id="categoryDropdownMenu" class="absolute left-0 mt-2 w-72 bg-white text-gray-800 rounded-xl shadow-2xl py-2 hidden z-50 border border-gray-100">
                    <div class="px-4 py-2 font-bold text-xs uppercase tracking-wider text-gray-400 border-b">Категории</div>
                    <div id="categoryDropdownItems" class="max-h-[70vh] overflow-y-auto">
                        <a href="#" onclick="filterByCategory('Всички'); closeCategoryDropdown();" class="block px-4 py-2.5 text-sm hover:bg-gray-100 font-medium transition border-b">
                            <i class="fa-solid fa-house mr-2 text-emagOrange"></i> Всички продукти
                        </a>
                        <a href="#" onclick="filterByCategory('Дрехи'); closeCategoryDropdown();" class="block px-4 py-2.5 text-sm hover:bg-gray-100 font-medium transition border-b">Дрехи</a>
                        <a href="#" onclick="filterByCategory('Електроника'); closeCategoryDropdown();" class="block px-4 py-2.5 text-sm hover:bg-gray-100 font-medium transition border-b">Електроника</a>
                        <a href="#" onclick="filterByCategory('Дом и кухня'); closeCategoryDropdown();" class="block px-4 py-2.5 text-sm hover:bg-gray-100 font-medium transition border-b">Дом и кухня</a>
                        <a href="#" onclick="filterByCategory('Спорт и на открито'); closeCategoryDropdown();" class="block px-4 py-2.5 text-sm hover:bg-gray-100 font-medium transition border-b">Спорт и на открито</a>
                        <a href="#" onclick="filterByCategory('Инструменти'); closeCategoryDropdown();" class="block px-4 py-2.5 text-sm hover:bg-gray-100 font-medium transition border-b">Инструменти</a>
                    </div>
                </div>
            </div>
            <div>
                <a href="#" onclick="switchView('home')" class="text-xl md:text-2xl font-black tracking-wider flex items-center gap-1.5">
                    <span class="bg-emagOrange text-white px-2 py-0.5 rounded text-sm md:text-lg">Твоят</span>Шанс
                </a>
            </div>
        </div>
    </div>
</header>
