<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог с продукти</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- Тук се зарежда динамично съдържанието -->
        <div id="loading-screen" style="text-align: center; padding: 50px; font-family: sans-serif;">
            <h2>Зареждане на каталога...</h2>
            <p>Моля, изчакайте, докато извлечем данните за продуктите.</p>
        </div>
    </div>

    <script>
        // Главни променливи на приложението
        let products = [];

        // Функция за зареждане на продуктите от външния JSON файл
        async function loadProducts() {
            const appContainer = document.getElementById('app');
            try {
                // Използваме абсолютен/относичен път, съобразен със структурата на папките ти
                let response = await fetch('data/products.json');
                
                if (!response.ok) {
                    throw new Error(`Грешка при мрежов достъп: ${response.status} ${response.statusText}`);
                }
                
                products = await response.json();
                
                // Проверка дали масивът наистина съдържа данни
                if (!Array.isArray(products)) {
                    throw new Error('Файлът products.json не съдържа валиден масив от продукти.');
                }

                // Стартираме рендирането на приложението след успешно зареждане
                renderApp();

            } catch (error) {
                console.error("Грешка при зареждане на продуктите:", error);
                appContainer.innerHTML = `
                    <div style="color: red; text-align: center; padding: 40px; font-family: sans-serif;">
                        <h3>Възникна проблем при зареждането на каталога!</h3>
                        <p>${error.message}</p>
                        <p>Моля, уверете се, че папка <strong>data</strong> и файл <strong>products.json</strong> съществуват и страницата е отворена през локален сървър или хостинг.</p>
                    </div>
                `;
            }
        }

        // Основна функция за визуализация на интерфейса
        function renderApp() {
            const appContainer = document.getElementById('app');
            
            // Тук се генерира цялостният HTML изглед на твоя магазин/каталог
            let html = `
                <header style="padding: 20px; background: #f4f4f4; margin-bottom: 20px;">
                    <h1>Онлайн Каталог</h1>
                    <p>Общ брой заредени продукти: <strong>${products.length}</strong></p>
                </header>
                <main style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 0 20px;">
            `;

            if (products.length === 0) {
                html += `<p>Няма налични продукти в базата данни.</p>`;
            } else {
                products.forEach(product => {
                    html += `
                        <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff;">
                            <h3>${product.name || 'Без име'}</h3>
                            <p>Цена: <strong>${product.price ? product.price + ' лв.' : 'По запитване'}</strong></p>
                            <p>${product.description || ''}</p>
                        </div>
                    `;
                });
            }

            html += `</main>`;
            appContainer.innerHTML = html;
        }

        // Извикваме функцията за зареждане веднага след зареждане на DOM дървото
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
